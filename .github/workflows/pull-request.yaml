name: Pull Requests

on:
  pull_request:
    branches:
      - main
      - track/**

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ignore:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      any_modified: ${{ steps.echo-changes.outputs.any_modified }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_ignore: |
            README.md
            CONTRIBUTING.md
            CODEOWNERS
            LICENSE
            icon.svg
            .gitignore
            .github/**
            CHANGELOG.md

      - name: Echo changed files
        id: echo-changes
        run: |
          echo "any_modified=${{ steps.changed-files.outputs.any_modified }}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: [ci-ignore]
    if: needs.ci-ignore.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - name: Run lint
        run: uvx tox -e lint

  static:
    name: Static analysis
    needs: [ci-ignore]
    if: needs.ci-ignore.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - name: Run static analysis
        run: uvx tox -e static

  unit:
    name: Unit tests
    needs: [ci-ignore]
    if: needs.ci-ignore.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - name: Run unit tests
        run: uvx tox -e unit

  pack:
    name: Pack charm
    needs: [lint, static, unit]
    if: needs.ci-ignore.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.pack.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: /home/runner/snap/charmcraft/common/cache/charmcraft
          key: ${{ runner.os }}-wheel-cache-${{ hashFiles('./uv.lock') }}
          restore-keys: ${{ runner.os }}-wheel-cache-
      - name: Setup LXD
        uses: canonical/setup-lxd@main
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Pack charm
        id: pack
        run: |
          charmcraft pack -v
          echo "artifact-name=charms-tests" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack.outputs.artifact-name }}
          path: ./*.charm

  integration-matrix:
    name: Integration test matrix
    needs: [ci-ignore]
    if: needs.ci-ignore.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.matrix.outputs.suites }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate matrix
        id: matrix
        run: |
          suites=$(find tests/integration -name 'test_*.py' -printf '%f\n' | jq -R -s -c 'split("\n")[:-1]')
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  integration:
    name: "Integration: ${{ matrix.suite }}"
    needs: [ci-ignore, pack, integration-matrix]
    if: needs.ci-ignore.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.integration-matrix.outputs.suites) }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5

      - name: Setup microK8s
        run: |
          sudo snap install microk8s --classic --channel=1.32-strict/stable
          sudo microk8s status --wait-ready
          sudo microk8s enable dns hostpath-storage

      - name: Setup Juju
        run: |
          sudo snap install juju --channel=3.6/stable
          sudo usermod -a -G microk8s "$USER"
          mkdir -p ~/.kube
          sudo microk8s config > ~/.kube/config
          sudo chown "$USER" ~/.kube/config

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.pack.outputs.artifact-name }}

      - name: Bootstrap Juju and run tests
        run: |
          charm_path="$(realpath "$(find . -maxdepth 1 -name '*.charm' | head -1)")"
          sg microk8s -c "juju bootstrap microk8s --model-default automatically-retry-hooks=true"
          sg microk8s -c "CHARM_PATH='$charm_path' uvx tox -e integration -- -k '${{ matrix.suite }}'"

      - name: Collect logs on failure
        if: failure()
        run: |
          sg microk8s -c "juju debug-log --replay --limit 1000" || true